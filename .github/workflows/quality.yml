name: 前端品質閘門

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint、型別、測試與建置
    runs-on: ubuntu-latest
    # 三瀏覽器 e2e 以單一 worker 執行，工具每增加一個就長一段。上一次通過的
    # 執行已用掉 27m44s，離 30 分鐘只剩不到兩分鐘，而共用機器的快慢本身就有
    # 一成以上的落差——這個上限已經不是在擋失控的測試，而是在擋一台比較慢的
    # 機器。放寬到 45 分鐘，讓超時重新代表「真的卡住了」。
    timeout-minutes: 45

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v5

      - name: 設定 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.15.0
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: 執行 lint
        run: npm run lint

      - name: 執行 strict typecheck
        run: npm run typecheck

      - name: 執行單元測試
        run: npm run test:unit

      - name: 安裝瀏覽器
        run: npx playwright install --with-deps chromium firefox webkit

      - name: 建置並執行三瀏覽器品質閘門
        run: npm run test:e2e

      - name: 保留失敗診斷
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
